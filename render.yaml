services:
  - type: web
    name: packshot-generator
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3-pro-image
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
