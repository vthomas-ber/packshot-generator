<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packshot generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@800&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #EEF3F1; color: #1D2B2A; font: 16px/1.5 Rubik, system-ui, sans-serif;
  }
  form {
    background: #FAFAFA; padding: 36px; border-radius: 8px; width: min(360px, 90vw);
    border: 1px solid #CFDAD7;
  }
  h1 { font: 800 2.2rem/1 "Barlow Semi Condensed", sans-serif; color: #00615F; margin: 0 0 8px; }
  p { color: #5B6B69; margin: 0 0 20px; }
  input {
    width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px;
    border: 1px solid #CFDAD7; border-radius: 6px; margin-bottom: 14px;
  }
  button {
    width: 100%; font: 500 1rem Rubik, sans-serif; padding: 11px; border-radius: 6px;
    border: 0; background: #00615F; color: #fff; cursor: pointer;
  }
  button:hover { background: #004A48; }
  .error { background: #FDE3DC; color: #7A2A18; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
  :focus-visible { outline: 3px solid #F26B4E; outline-offset: 2px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Packshot generator</h1>
  <p>Enter the team password to continue.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="password" name="password" aria-label="Password" placeholder="Password" autofocus required>
  <button type="submit">Log in</button>
</form>
</body>
</html>
