<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packshot generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@800&family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #00615F;
    --teal-dark: #004A48;
    --canvas: #FAFAFA;
    --page: #EEF3F1;
    --ink: #1D2B2A;
    --muted: #5B6B69;
    --mint: #DDF2E8;
    --coral: #F26B4E;
    --line: #CFDAD7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 Rubik, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    max-width: 1080px; margin: 0 auto; padding: 28px 24px 8px;
  }
  h1 {
    font: 800 2.4rem/1 "Barlow Semi Condensed", sans-serif;
    color: var(--teal); margin: 0; letter-spacing: -0.01em;
  }
  header form button {
    background: none; border: 0; color: var(--muted); font: inherit;
    cursor: pointer; text-decoration: underline;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 24px 48px; }
  .lede { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }

  /* The drop zone is a live preview of the 16:9 #FAFAFA canvas */
  .modes { display: flex; gap: 0; margin: 0 0 16px; border: 1px solid var(--teal);
           border-radius: 6px; width: fit-content; overflow: hidden; }
  .modes label { cursor: pointer; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes span { display: block; padding: 9px 20px; color: var(--teal); font-weight: 500;
                border-right: 1px solid var(--teal); }
  .modes label:last-child span { border-right: 0; }
  .modes input:checked + span { background: var(--teal); color: #fff; }
  .modes input:focus-visible + span { outline: 3px solid var(--coral); outline-offset: -3px; }
  .mode-help { color: var(--muted); font-size: .9rem; margin: -8px 0 16px; }
  input[type=number] {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    width: 110px; background: #fff; color: var(--ink);
  }
  .frame {
    position: relative; aspect-ratio: 2160 / 1280; background: var(--canvas);
    border: 2px dashed var(--line); border-radius: 6px; overflow: hidden;
    transition: border-color .15s;
  }
  .frame.drag { border-color: var(--teal); }
  .frame.has-result { border-style: solid; border-color: var(--line); }
  .empty {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; color: var(--muted); padding: 24px;
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.15rem; font-weight: 500; }
  .empty button { margin-top: 14px; }
  .row {
    position: absolute; left: 4%; right: 4%; top: 18%; height: 45%;
    display: flex; gap: 2%; justify-content: center; align-items: flex-end;
  }
  .item { position: relative; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
  .item img { max-height: 100%; max-width: 100%; object-fit: contain; display: block;
              filter: drop-shadow(0 10px 8px rgba(0,0,0,.12)); }
  .tools {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; opacity: .85;
  }
  .tools button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1;
  }
  .tools button:hover { border-color: var(--teal); color: var(--teal); }
  .result { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .busy {
    position: absolute; inset: 0; display: none; place-content: center; text-align: center;
    background: rgba(250,250,250,.85); color: var(--teal); font-weight: 500;
  }
  .busy.on { display: grid; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--mint); border-top-color: var(--teal);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

  .controls {
    display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; margin-top: 20px;
  }
  label.field { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input[type=text] {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    min-width: 240px; background: #fff; color: var(--ink);
  }
  label.check { display: flex; gap: 8px; align-items: center; font-size: .95rem; padding-bottom: 10px; }
  .spacer { flex: 1; }
  .btn {
    font: 500 1rem Rubik, sans-serif; border-radius: 6px; padding: 11px 22px;
    border: 1px solid var(--teal); cursor: pointer;
  }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.primary:hover { background: var(--teal-dark); }
  .btn.secondary { background: #fff; color: var(--teal); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  a.btn { text-decoration: none; display: inline-block; }
  :focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  .notes { margin: 20px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .notes li { padding: 8px 12px; border-radius: 6px; background: var(--mint); font-size: .92rem; }
  .notes li.warn { background: #FDE3DC; color: #7A2A18; }
  .count { color: var(--muted); font-size: .9rem; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Packshot generator</h1>
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
</header>

<main>
  <p class="lede">Drop in the product photos for one parcel. You'll get a 2160 × 1280 image on
    a #FAFAFA background, with products in the order shown below.</p>

  <div class="modes" role="radiogroup" aria-label="Image type">
    <label><input type="radio" name="mode" value="neutral" checked><span>Neutral</span></label>
    <label><input type="radio" name="mode" value="tray"><span>Tray</span></label>
    <label><input type="radio" name="mode" value="surprise"><span>Surprise box</span></label>
  </div>
  <p class="mode-help" id="modeHelp"></p>

  <div class="frame" id="frame">
    <div class="empty" id="empty">
      <div>
        <strong>Drop product photos here</strong>
        <span id="limitText">Up to 8 images</span>, PNG, JPG or WEBP
        <div><button class="btn secondary" type="button" id="pick">Choose photos</button></div>
      </div>
    </div>
    <div class="row" id="row" hidden></div>
    <img class="result" id="result" alt="Generated packshot" hidden>
    <div class="busy" id="busy"><div><div class="spinner"></div>Building your packshot. Messy photos take up to a minute.</div></div>
  </div>
  <div class="count" id="count"></div>

  <div class="controls" id="controls">
    <label class="field">Item ID (used as the file name)
      <input type="text" id="itemId" placeholder="e.g. TGTGIT00003081" autocomplete="off">
    </label>
    <label class="field" id="unitsField" hidden>Units in the tray
      <input type="number" id="units" min="2" max="20" value="6">
    </label>
    <label class="check"><input type="checkbox" id="force"> Clean every photo with Gemini</label>
    <span class="spacer"></span>
    <button class="btn secondary" type="button" id="addMore" hidden>Add photos</button>
    <button class="btn primary" type="button" id="generate" disabled>Generate packshot</button>
  </div>

  <div class="controls" id="done" hidden>
    <a class="btn primary" id="download" download>Download packshot</a>
    <button class="btn secondary" type="button" id="edit">Change photos</button>
    <button class="btn secondary" type="button" id="reset">Start a new packshot</button>
  </div>

  <ul class="notes" id="notes"></ul>
  <input type="file" id="file" accept=".png,.jpg,.jpeg,.webp" multiple hidden>
</main>

<script>
const MODES = {
  neutral:  { max: 8, help: "Products side by side, centred in the top 65% of the frame." },
  tray:     { max: 6, help: "Add one photo per product type. The units are split evenly between them, grouped left to right." },
  surprise: { max: 6, help: "Products dropping into the Too Good To Go box." },
};
let MAX = 8;
let files = [];
const $ = id => document.getElementById(id);
const frame = $("frame"), row = $("row"), fileInput = $("file");

function render() {
  row.innerHTML = "";
  files.forEach((f, i) => {
    const item = document.createElement("div");
    item.className = "item";
    item.style.flex = `0 1 ${Math.floor(90 / Math.max(files.length, 1))}%`;
    const img = document.createElement("img");
    img.src = f.url; img.alt = f.file.name;
    const tools = document.createElement("div");
    tools.className = "tools";
    tools.innerHTML =
      `<button type="button" title="Move left" aria-label="Move ${f.file.name} left" ${i === 0 ? "disabled" : ""}>&#8249;</button>` +
      `<button type="button" title="Remove" aria-label="Remove ${f.file.name}">&times;</button>` +
      `<button type="button" title="Move right" aria-label="Move ${f.file.name} right" ${i === files.length - 1 ? "disabled" : ""}>&#8250;</button>`;
    const [l, x, r] = tools.querySelectorAll("button");
    l.onclick = () => { [files[i - 1], files[i]] = [files[i], files[i - 1]]; render(); };
    r.onclick = () => { [files[i + 1], files[i]] = [files[i], files[i + 1]]; render(); };
    x.onclick = () => { URL.revokeObjectURL(f.url); files.splice(i, 1); render(); };
    item.append(tools, img);
    row.append(item);
  });
  const has = files.length > 0;
  row.hidden = !has;
  $("empty").hidden = has;
  $("addMore").hidden = !has || files.length >= MAX;
  $("generate").disabled = !has;
  const over = files.length > MAX;
  $("count").textContent = has ? `${files.length} of ${MAX} photos. Use the arrows to change the order.` +
    (over ? ` This mode takes ${MAX}; remove ${files.length - MAX}.` : "") : "";
  $("generate").disabled = !has || over;
}

function mode() { return document.querySelector('input[name="mode"]:checked').value; }
function applyMode() {
  const m = MODES[mode()];
  MAX = m.max;
  $("modeHelp").textContent = m.help;
  $("limitText").textContent = mode() === "tray" ? `Up to ${MAX} product types` : `Up to ${MAX} images`;
  $("unitsField").hidden = mode() !== "tray";
  render();
}
document.querySelectorAll('input[name="mode"]').forEach(r => r.onchange = applyMode);

function addFiles(list) {
  const ok = [...list].filter(f => /\.(png|jpe?g|webp)$/i.test(f.name));
  for (const f of ok) {
    if (files.length >= MAX) break;
    files.push({ file: f, url: URL.createObjectURL(f) });
  }
  showNotes([]);
  render();
}

function showNotes(notes, error) {
  const ul = $("notes");
  ul.innerHTML = "";
  if (error) notes = [error];
  notes.forEach(n => {
    const li = document.createElement("li");
    li.textContent = n;
    if (error || /failed|check/i.test(n)) li.className = "warn";
    ul.append(li);
  });
}

function showEditor() {
  $("result").hidden = true;
  frame.classList.remove("has-result");
  $("controls").hidden = false;
  $("done").hidden = true;
  render();
}

$("pick").onclick = $("addMore").onclick = () => fileInput.click();
fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ""; };

["dragenter", "dragover"].forEach(ev => frame.addEventListener(ev, e => {
  e.preventDefault(); if ($("result").hidden) frame.classList.add("drag");
}));
["dragleave", "drop"].forEach(ev => frame.addEventListener(ev, e => {
  e.preventDefault(); frame.classList.remove("drag");
}));
frame.addEventListener("drop", e => { if ($("result").hidden) addFiles(e.dataTransfer.files); });

$("generate").onclick = async () => {
  const fd = new FormData();
  files.forEach(f => fd.append("images", f.file, f.file.name));
  fd.append("item_id", $("itemId").value.trim());
  fd.append("mode", mode());
  if (mode() === "tray") fd.append("units", $("units").value);
  if ($("force").checked) fd.append("force_gemini", "1");

  $("busy").classList.add("on");
  $("generate").disabled = true;
  showNotes([]);
  try {
    const res = await fetch("/generate", { method: "POST", body: fd });
    const data = await res.json().catch(() => ({ error: `Server error (${res.status}). Try again.` }));
    if (!res.ok) {
      if (res.status === 401) { location.href = "/"; return; }
      throw new Error(data.error || "Something went wrong.");
    }
    $("result").src = data.image;
    $("result").hidden = false;
    row.hidden = true;
    frame.classList.add("has-result");
    $("download").href = data.image;
    $("download").download = data.filename;
    $("controls").hidden = true;
    $("done").hidden = false;
    $("count").textContent = "";
    showNotes(data.notes || []);
  } catch (err) {
    showNotes([], err.message);
  } finally {
    $("busy").classList.remove("on");
    $("generate").disabled = files.length === 0;
  }
};

$("edit").onclick = showEditor;
$("reset").onclick = () => {
  files.forEach(f => URL.revokeObjectURL(f.url));
  files = []; $("itemId").value = ""; $("force").checked = false;
  showNotes([]); showEditor();
};
applyMode();
</script>
</body>
</html>
